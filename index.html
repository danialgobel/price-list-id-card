<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <script>
    window.location.replace("https://tanabrew-stok-and-invoice.vercel.app/pricelist");
  </script>
  <meta http-equiv="refresh" content="0; url=https://tanabrew-stok-and-invoice.vercel.app/pricelist" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Tanabrew – Kopi pilihan berkualitas tinggi. Lihat daftar harga produk kami dan hubungi kami via WhatsApp atau Instagram." />

  <!-- Open Graph -->
  <meta property="og:title" content="Tanabrew – Price List" />
  <meta property="og:description" content="Kopi pilihan berkualitas tinggi. Lihat daftar harga & hubungi kami sekarang." />
  <meta property="og:image" content="images/pricelist.jpg" />
  <meta property="og:type" content="website" />

  <title>Tanabrew – Price List</title>

  <!-- Favicon: SVG inline data URI dengan inisial "T" background hijau -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231B5E20'/%3E%3Ctext x='50%25' y='54%25' dominant-baseline='middle' text-anchor='middle' font-family='Poppins%2C sans-serif' font-size='20' font-weight='700' fill='%23ffffff'%3ET%3C/text%3E%3C/svg%3E" />

  <!-- Google Fonts: Poppins -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ===== HEADER ===== -->
  <header class="site-header">
    <div class="header-inner">
      <!-- Leaf accent SVG -->
      <div class="leaf-accent" aria-hidden="true">
        <svg viewBox="0 0 60 80" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M30 75 C10 55 5 30 30 5 C55 30 50 55 30 75Z" fill="rgba(255,255,255,0.15)" />
          <line x1="30" y1="75" x2="30" y2="5" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" stroke-dasharray="4 3"/>
        </svg>
      </div>
      <h1 class="brand-name">Tanabrew</h1>
      <p class="brand-tagline">Price List</p>
    </div>
  </header>

  <!-- ===== MAIN CONTENT ===== -->
  <main class="main-content">

    <!-- Price List Image Section -->
    <section class="pricelist-section" aria-label="Daftar Harga Produk Tanabrew">
      <div class="pricelist-wrapper">
        <button class="pricelist-btn" id="openLightbox" aria-label="Tap untuk memperbesar gambar daftar harga">
          <img
            src="images/pricelist.jpg"
            alt="Daftar harga produk Tanabrew Roastery – Single Origin Filter Roast dan Roasted Beans Espresso"
            class="pricelist-img"
            id="pricelistImg"
            loading="eager"
          />
          <div class="zoom-hint" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/>
              <path d="M11 8v6M8 11h6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
              <path d="M16.5 16.5L21 21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
            Tap untuk zoom
          </div>
        </button>
      </div>
    </section>

    <!-- CTA Buttons Section -->
    <section class="cta-section" aria-label="Hubungi Kami">
      <a
        href="https://wa.me/628813728621?text=Halo%20Tanabrew%2C%20saya%20tertarik%20dengan%20produknya%2C%20boleh%20minta%20info%20lebih%20lanjut%3F"
        class="btn btn-whatsapp"
        id="waButton"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Chat via WhatsApp dengan Tanabrew"
      >
        <!-- WhatsApp Icon -->
        <svg class="btn-icon" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/>
        </svg>
        Chat via WhatsApp
      </a>

      <a
        href="https://www.instagram.com/tanabrew.tm/"
        class="btn btn-instagram"
        id="igButton"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Kunjungi Instagram Tanabrew"
      >
        <!-- Instagram Icon -->
        <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <rect x="2" y="2" width="20" height="20" rx="5" ry="5"/>
          <circle cx="12" cy="12" r="4"/>
          <circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/>
        </svg>
        Follow Instagram Kami
      </a>
    </section>

  </main>

  <!-- ===== FOOTER ===== -->
  <footer class="site-footer">
    <p>© 2026 Tanabrew &nbsp;·&nbsp; Terima kasih sudah mampir</p>
  </footer>

  <!-- ===== LIGHTBOX ===== -->
  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Zoom gambar daftar harga" hidden>
    <div class="lightbox-backdrop" id="lightboxBackdrop"></div>
    <div class="lightbox-content">
      <button class="lightbox-close" id="closeLightbox" aria-label="Tutup zoom">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
          <line x1="18" y1="6" x2="6" y2="18"/>
          <line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
      <img
        src="images/pricelist.jpg"
        alt="Daftar harga produk Tanabrew Roastery – versi zoom"
        class="lightbox-img"
        id="lightboxImg"
      />
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
